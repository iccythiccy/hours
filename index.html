<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hours</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hours">
<meta name="theme-color" content="#0b0b0d">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0b0b0d; --card:#17171a; --card2:#1f1f23; --line:#2a2a2f;
    --text:#f4f4f6; --muted:#8e8e96; --accent:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:460px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .weeknav{display:flex;align-items:center;gap:2px;margin-left:-6px}
  .wkbtn{background:none;border:0;color:var(--accent);font-size:22px;line-height:1;padding:2px 8px;cursor:pointer;font-family:inherit}
  .wkbtn:disabled{color:#3a3a40;cursor:default}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--text);
    display:grid;place-items:center;cursor:pointer}
  .card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}

  /* Tap-to-pick fields: the real input sits invisibly on top so iOS opens its native wheel */
  .pick{position:relative;border-radius:14px;background:var(--card2);padding:12px 14px;cursor:pointer}
  .pick input,.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;
    border:0;margin:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
  .pick .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .pick .val{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .pick:active{background:#29292e}
  .pick.attn{box-shadow:inset 0 0 0 2px var(--orange)}
  .pick.attn .lbl{color:var(--orange)}
  .pick .val.blank{color:#4a4a52}
  .now{position:absolute;top:9px;right:9px;z-index:2;border:0;border-radius:999px;background:rgba(10,132,255,.18);
    color:var(--accent);font-size:13px;font-weight:600;padding:5px 10px;font-family:inherit;cursor:pointer}
  .now:active{background:rgba(10,132,255,.35)}
  .daterow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .daterow .pick{padding:8px 14px}
  .daterow .pick .val{font-size:17px;margin:0;white-space:nowrap}
  .status{font-size:13px;color:var(--muted);text-align:right}
  .status.ok{color:var(--green)}
  .status.warnc{color:var(--orange)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .breakrow{margin-top:10px}
  .breakrow .pick{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
  .breakrow .val{font-size:17px;margin:0}
  .addbrk{width:100%;border:0;color:var(--text);font-family:inherit;text-align:left}
  .addbrk .val{color:var(--accent);font-weight:600}
  #breaks .pick .val{font-size:24px}
  .brkblock{margin-top:10px}
  .brkfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--muted);padding:0 2px}
  .brkfoot .del{padding:0}

  .offpanel{text-align:center;padding:22px 8px 10px}
  .offpanel .big{font-size:28px;font-weight:700;letter-spacing:-.02em}
  .offpanel .small{color:var(--muted);font-size:14px;margin-top:4px}

  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .tot{padding:4px 2px}
  .tot .n{font-size:clamp(20px,6vw,25px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tot .t{font-size:13px;color:var(--muted)}
  .cardfoot{display:flex;justify-content:flex-end;margin-top:6px}

  .warn{display:none;background:rgba(255,159,10,.12);color:#ffb340;border-radius:12px;
    padding:10px 12px;font-size:14px;line-height:1.4;margin-top:12px}
  .warn.show{display:block}
  .warn div+div{margin-top:6px}

  .bubblewrap{display:flex;justify-content:flex-end;margin:4px 0 14px}
  .bubble{background:var(--accent);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;
    font-size:16px;line-height:1.35;white-space:pre-wrap;max-width:88%;-webkit-user-select:text;user-select:text}
  .bubble.blank{background:var(--card2);color:var(--muted)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;cursor:pointer;
    text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.secondary{background:var(--card2);color:var(--text)}
  .btn:active{transform:scale(.98);opacity:.9}
  .btn.disabled{opacity:.35;pointer-events:none}

  .weekhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .week h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0;font-weight:600}
  .linkbtn{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;font-family:inherit;padding:4px 0;cursor:pointer}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .row:first-of-type{border-top:0}
  .row .d{font-weight:600;min-width:74px;margin-right:10px;white-space:nowrap}
  .row .tm{color:var(--muted);flex:1;font-size:14px}
  .row .h{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .row .badge{display:inline-block;min-width:16px;margin-left:6px;font-size:13px;color:var(--green);text-align:center}
  .row .badge.stale{color:var(--orange)}
  .row.empty .d,.row.empty .h{color:#4a4a52}
  .row.missing .d,.row.missing .tm{color:var(--orange)}
  .row.sel .d{color:var(--accent)}
  .row.future{display:none}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .del{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 0 0;cursor:pointer;font-family:inherit}
  .del.armed{color:var(--red);font-weight:600}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,30px);
    background:#2c2c31;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:500;
    opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10;white-space:nowrap;
    display:flex;align-items:center;gap:14px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.show.undoable{pointer-events:auto}
  .toast button{display:none;background:none;border:0;color:var(--accent);font-weight:700;font-size:15px;padding:0;font-family:inherit;cursor:pointer}
  .toast.undoable button{display:inline}

  /* settings sheet */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
  .sheet.open{display:flex}
  .panel{background:var(--card);width:100%;max-width:460px;margin:0 auto;border-radius:22px 22px 0 0;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .panel h3{margin:0 0 14px;font-size:20px}
  .panel h4{margin:6px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input[type=text],.field input[type=tel],.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
  .field textarea{height:76px;resize:none;font-size:13px}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
  .note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px}
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .btnrow .btn{padding:12px;font-size:15px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .hp{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Hours</h1>
      <div class="sub weeknav">
        <button class="wkbtn" id="prevWk" aria-label="Previous week">‹</button>
        <span id="weekLabel"></span>
        <button class="wkbtn" id="nextWk" aria-label="Next week">›</button>
      </div>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="card">
    <div class="daterow">
      <label class="pick">
        <div class="val" id="dateVal"></div>
        <input type="date" id="date" aria-label="Date">
      </label>
      <div class="status" id="status"></div>
    </div>

    <div id="workBox">
      <div class="grid2">
        <label class="pick" id="startPick">
          <div class="lbl">Start</div>
          <div class="val" id="startVal"></div>
          <input type="time" id="start" aria-label="Start time">
          <button class="now" id="startNow" type="button">Now</button>
        </label>
        <label class="pick" id="endPick">
          <div class="lbl">End</div>
          <div class="val" id="endVal"></div>
          <input type="time" id="end" aria-label="End time">
          <button class="now" id="endNow" type="button">Now</button>
        </label>
      </div>

      <div id="breaks"></div>
      <div class="breakrow" id="addRow">
        <button class="pick addbrk" id="addBrk" type="button">
          <span class="lbl" id="addLbl">Unpaid break</span><span class="val">+ Add</span>
        </button>
      </div>
    </div>

    <div class="offpanel" id="offPanel" hidden>
      <div class="big">Day off</div>
      <div class="small">No hours counted. Nothing to text unless you're correcting something.</div>
    </div>

    <div class="totals">
      <div class="tot"><div class="n" id="dayTot"></div><div class="t">This day</div></div>
      <div class="tot"><div class="n" id="weekTot"></div><div class="t">Week through this day</div></div>
    </div>

    <div class="warn" id="warn"></div>
    <div class="cardfoot"><button class="del" id="offBtn" type="button">Mark as day off</button></div>
  </div>

  <div class="bubblewrap"><div class="bubble" id="msg"></div></div>

  <div class="btns">
    <button class="btn secondary" id="copyBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
    <a class="btn primary" id="textBtn" href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1-.2 1.3-.8 2.5-1.8 3.4 2 0 3.8-.7 5.1-1.8 1.1.3 2.3.5 3.6.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>
      <span id="textLbl">Text</span>
    </a>
  </div>

  <div class="card week" style="margin-top:12px">
    <div class="weekhead">
      <h2 id="weekTitle">This week</h2>
      <button class="linkbtn" id="copyWeek" type="button">Copy week</button>
    </div>
    <div id="weekList"></div>
    <div class="legend" id="legend"></div>
    <button class="del" id="delBtn">Delete this day's entry</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>Settings</h3>
    <div class="field">
      <label for="cName">Client name (for the button)</label>
      <input type="text" id="cName" placeholder="e.g. Mike" autocomplete="off">
    </div>
    <div class="field">
      <label for="cPhone">Client's mobile number</label>
      <input type="tel" id="cPhone" placeholder="e.g. 941-555-0123" autocomplete="off">
      <div class="note">Stored only on this phone. Used to open Messages with your hours already typed in.</div>
    </div>
    <div class="toggle">
      <span>Include break times in the text</span>
      <label style="position:relative"><input type="checkbox" id="showBrk" switch></label>
    </div>

    <div class="divider"></div>
    <h4>Backup</h4>
    <div class="note" id="backupNote" style="margin-bottom:10px"></div>
    <div class="btnrow">
      <button class="btn secondary" id="backupBtn">Copy backup</button>
      <button class="btn secondary" id="restoreBtn">Restore</button>
    </div>
    <div class="field">
      <textarea id="restoreText" placeholder="To restore: paste a backup here, then tap Restore."></textarea>
    </div>

    <button class="btn primary" id="closeSettings" style="width:100%">Done</button>
    <div class="note" id="version" style="text-align:center;margin-top:12px"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastUndo" type="button">Undo</button></div>
<label class="hp" id="hpLabel"><input type="checkbox" switch id="hpInput"></label>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const KEY = "hours.v1";
  const LONG_DAY = 13 * 60;   // warn above this many minutes
  const MAX_BREAKS = 2;
  const VERSION = "7", UPDATED = "Nov 10, 2026";

  // ---------- storage (local to this phone) ----------
  function load(){
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.entries) return s; } catch(e){}
    return { entries:{}, settings:{ name:"", phone:"", showBrk:true } };
  }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch(e){ toast("Couldn't save on this device"); return false; }
  }
  const state = load();
  state.settings = Object.assign({ name:"", phone:"", showBrk:true }, state.settings||{});
  state.drafts = state.drafts || {};   // clock-ins with no end time yet
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));

  // ---------- time & format helpers ----------
  const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
  const pad = n => String(n).padStart(2,"0");
  const fromMin = m => pad(Math.floor(m/60)%24)+":"+pad(m%60);
  function fmtTime(t){
    const m = toMin(t), h24 = Math.floor(m/60), mm = m%60;
    const h12 = (h24 % 12) || 12, ap = h24 < 12 ? "am" : "pm";
    return mm ? `${h12}:${pad(mm)}${ap}` : `${h12}${ap}`;
  }
  function fmtDur(m){
    const h = Math.floor(m/60), r = m%60, out = [];
    if (!h && !r) return "0hrs";
    if (h) out.push(h === 1 ? "1hr" : `${h}hrs`);
    if (r) out.push(`${r}min`);
    return out.join(" ");
  }
  const between = (a,b) => { let d = toMin(b) - toMin(a); if (d < 0) d += 1440; return d; };
  const crossesMidnight = e => toMin(e.end) < toMin(e.start);
  function worked(e){
    if (!e || e.off) return 0;
    let d = toMin(e.end) - toMin(e.start);
    if (d < 0) d += 1440;             // past midnight
    return Math.max(0, d - (e.brk||0));
  }
  const TIME_RE = /^\d{2}:\d{2}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const validBreak = b => b && TIME_RE.test(b.s) && TIME_RE.test(b.e);
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
  const md = s => { const d = parseIso(s); return `${d.getMonth()+1}/${d.getDate()}`; };
  function monday(s){ const d = parseIso(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
  function weekDates(s){ const m = monday(s); return [...Array(7)].map((_,i)=>{ const d = new Date(m); d.setDate(m.getDate()+i); return iso(d); }); }
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayName = s => DOW[(parseIso(s).getDay()+6)%7] + " " + md(s);
  const nowExact = () => { const d = new Date(); return fromMin(d.getHours()*60 + d.getMinutes()); };

  // Breaks of a saved entry, whatever version of the app saved it, earliest first
  const relTo = start => t => (toMin(t) - toMin(start) + 1440) % 1440;
  function entryBreaks(en){
    if (!en || en.off) return [];
    let list = [];
    if (Array.isArray(en.breaks)) list = en.breaks.filter(validBreak).map(b => ({ s:b.s, e:b.e }));
    else if (TIME_RE.test(en.bStart) && TIME_RE.test(en.bEnd)) list = [{ s:en.bStart, e:en.bEnd }];
    if (TIME_RE.test(en.start)) { const rel = relTo(en.start); list.sort((a,b) => rel(a.s) - rel(b.s)); }
    return list;
  }

  // ---------- the text lines ----------
  function breakText(en){
    const bs = entryBreaks(en);
    if (!bs.length || !state.settings.showBrk) return "";
    return ` (${bs.map(b => `${fmtTime(b.s)}-${fmtTime(b.e)}`).join(", ")} break${bs.length > 1 ? "s" : ""})`;
  }
  function dayLine(d, en){
    if (en.off) return `${md(d)} off`;
    return `${md(d)} ${fmtTime(en.start)}-${fmtTime(en.end)}${breakText(en)} ${fmtDur(worked(en))}`;
  }
  const totalLine = n => `${fmtDur(n)} total for the week.`;

  // ---------- haptics (native pickers already tick; this is for buttons) ----------
  function haptic(){
    try { if (navigator.vibrate) { navigator.vibrate(10); return; } } catch(e){}
    try { $("hpLabel").click(); } catch(e){}   // iOS 18+ switch-toggle haptic
  }

  // ---------- form state ----------
  let today = iso(new Date());
  let cur = today;
  let endIsDefault = false;   // end time was filled in by the app, not chosen
  let brks = [];              // [{s, e, sDef, eDef, el}] — breaks being edited
  const isOff = () => !!(state.entries[cur] && state.entries[cur].off);

  function lastEntry(){
    const keys = Object.keys(state.entries).filter(k => !state.entries[k].off).sort();
    return keys.length ? state.entries[keys[keys.length-1]] : null;
  }

  function formEntry(){
    if (isOff()) return { off:true };
    const e = { start:$("start").value, end:$("end").value, brk:0 };
    if (brks.length){
      e.breaks = brks.map(b => ({ s:b.s, e:b.e }));
      if (e.breaks.every(validBreak)){
        e.brk = e.breaks.reduce((t,b) => t + between(b.s, b.e), 0);
        if (TIME_RE.test(e.start)) e.breaks = entryBreaks(e);
      }
    }
    return e;
  }
  const complete = e => e.off || (TIME_RE.test(e.start) && TIME_RE.test(e.end) && (!e.breaks || e.breaks.every(validBreak)));
  const sameEntry = (a,b) => !!(a && b) && (a.off || b.off ? !!a.off === !!b.off
    : a.start===b.start && a.end===b.end && JSON.stringify(entryBreaks(a)) === JSON.stringify(entryBreaks(b)));

  function breakProblems(e){
    const probs = [];
    if (e.off || !e.breaks || !e.breaks.every(validBreak)) return probs;
    const rel = relTo(e.start), L = between(e.start, e.end) || 1440;
    const bs = entryBreaks(e);
    if (bs.some(b => !(rel(b.s) < rel(b.e) && rel(b.e) <= L)))
      probs.push((bs.length > 1 ? "A break isn't" : "The break isn't") + " inside your work hours. Check the break times (and AM/PM).");
    for (let i = 0; i < bs.length - 1; i++){
      if (rel(bs[i].e) > rel(bs[i+1].s)) { probs.push("Your two breaks overlap. Check the break times."); break; }
    }
    return probs;
  }

  // ---------- break tiles (built only when breaks are added/removed, so an open wheel is never rebuilt) ----------
  function buildBreaks(){
    const box = $("breaks"); box.innerHTML = "";
    brks.forEach((b, i) => {
      const blk = document.createElement("div");
      blk.className = "brkblock";
      blk.innerHTML =
        `<div class="grid2">
           <label class="pick"><div class="lbl">Break start</div><div class="val"></div><input type="time" aria-label="Break ${i+1} start"></label>
           <label class="pick"><div class="lbl">Break end</div><div class="val"></div><input type="time" aria-label="Break ${i+1} end"></label>
         </div>
         <div class="brkfoot"><span></span><button class="del" type="button">Remove</button></div>`;
      const picks = blk.querySelectorAll(".pick"), ins = blk.querySelectorAll("input");
      b.el = { sPick:picks[0], ePick:picks[1], sVal:picks[0].querySelector(".val"), eVal:picks[1].querySelector(".val"),
               foot:blk.querySelector(".brkfoot span") };
      ins[0].value = b.s; ins[1].value = b.e;
      const wire = (input, key, defKey) => {
        input.addEventListener("input", () => { b[key] = input.value; b[defKey] = false; render(); });
        input.addEventListener("change", () => { b[key] = input.value; b[defKey] = false; saveCurrent(); });
      };
      wire(ins[0], "s", "sDef"); wire(ins[1], "e", "eDef");
      blk.querySelector(".del").addEventListener("click", () => {
        haptic();
        brks.splice(brks.indexOf(b), 1);
        buildBreaks();
        saveCurrent();
      });
      box.appendChild(blk);
    });
  }
  function setBreaks(list, isDefault){
    brks = list.map(b => ({ s:b.s, e:b.e, sDef:!!isDefault, eDef:!!isDefault }));
    buildBreaks();
  }

  function loadDate(s){
    cur = s;
    $("date").value = s;
    const e = state.entries[s];
    if (e && !e.off){
      $("start").value = e.start; $("end").value = e.end;
      endIsDefault = false;
      const list = entryBreaks(e);
      if (list.length) setBreaks(list, false);
      else if (e.brk) setBreaks([{ s:"12:00", e:fromMin(720 + e.brk) }], true);  // oldest duration-only break
      else setBreaks([]);
    } else if (!e) {
      const last = lastEntry(), draft = state.drafts[s];
      $("start").value = draft ? draft.start : (last ? last.start : "09:00");
      $("end").value = (s === today) ? nowExact() : (last ? last.end : "17:00");
      endIsDefault = true;
      setBreaks(draft && draft.breaks ? draft.breaks : [], false);
    } else {
      setBreaks([]);
    }
    render();
  }

  // ---------- undo (one step, for changes to days that were already logged) ----------
  let undo = null, undoTimer;
  function snapshot(d){
    if (!undo || undo.date !== d) undo = { date:d, prev: clone(state.entries[d]) };
  }
  function offerUndo(label){
    toast(label, true);
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { undo = null; }, 6000);
  }
  $("toastUndo").addEventListener("click", () => {
    if (!undo) return;
    haptic();
    if (undo.prev === undefined) delete state.entries[undo.date]; else state.entries[undo.date] = undo.prev;
    const d = undo.date; undo = null;
    persist(); toast("Undone"); loadDate(d);
  });

  // Save the form. Until an end time is chosen (or you send), today's start is kept as a clock-in draft.
  function saveCurrent(){
    if (isOff()) { render(); return false; }
    const e = formEntry();
    const prev = state.entries[cur];
    if (!prev && endIsDefault){
      if (TIME_RE.test(e.start)){
        state.drafts[cur] = { start:e.start, breaks: brks.filter(validBreak).map(b => ({ s:b.s, e:b.e })) };
        persist();
      }
      render(); return false;
    }
    if (!complete(e)) { render(); return false; }
    if (!e.breaks || !e.breaks.length) delete e.breaks;
    const changed = prev && !sameEntry(prev, e);
    if (prev && !changed) { render(); return true; }
    if (changed) snapshot(cur);
    if (prev && prev.sent) e.sent = prev.sent;
    state.entries[cur] = e;
    delete state.drafts[cur];
    endIsDefault = false;
    if (persist() && changed) offerUndo(`Updated ${dayName(cur)}`);
    render();
    return true;
  }

  // ---------- composing the text ----------
  // Works out what your client needs to hear: today's line, plus corrections for any day
  // whose hours changed after you texted it, ending with the up-to-date week total.
  function compose(){
    const fe = formEntry();
    if (!complete(fe)) return null;
    const week = weekDates(cur);
    const E = {};
    week.forEach(d => { if (state.entries[d]) E[d] = state.entries[d]; });
    const saved = state.entries[cur];
    E[cur] = Object.assign({}, fe, saved && saved.sent ? { sent:saved.sent } : {});

    const totalThrough = d => week.filter(x => x <= d).reduce((t,x) => t + worked(E[x]), 0);
    const line = d => dayLine(d, E[d]);
    const corr = d => "Correction: " + line(d);
    const texted = week.filter(d => E[d] && E[d].sent);
    const latest = texted.length ? texted[texted.length-1] : null;
    const anchor = latest && latest > cur ? latest : cur;
    const changed = texted.filter(d => line(d) !== E[d].sent.line);
    const curTexted = !!E[cur].sent;

    let text, kind, fixed = changed.slice();
    if (anchor === cur && !curTexted){
      const before = changed.filter(d => d < cur);
      if (fe.off){
        if (!before.length) return null;
        text = [...before.map(corr), totalLine(totalThrough(cur))].join("\n"); kind = "fix";
      } else {
        text = [...before.map(corr), line(cur), totalLine(totalThrough(cur))].join("\n");
        kind = before.length ? "daily+fix" : "daily";
      }
    } else {
      const set = new Set(changed);
      if (!curTexted && !fe.off) set.add(cur);                  // a day logged late, after later days were texted
      const totalStale = totalLine(totalThrough(anchor)) !== (E[anchor].sent ? E[anchor].sent.total : "");
      if (!set.size && !totalStale){
        if (fe.off) return null;
        text = [line(cur), totalLine(totalThrough(cur))].join("\n"); kind = "resend";
      } else {
        const lines = [...set].sort().map(corr);
        text = lines.length ? [...lines, totalLine(totalThrough(anchor))].join("\n") : "Updated: " + totalLine(totalThrough(anchor));
        kind = "fix"; fixed = [...set].sort();
      }
    }
    return { text, kind, anchor, fixed: fixed.filter(d => d !== cur || curTexted) };
  }

  // After sending: remember what your client now knows for each day this week
  function markSent(r){
    const week = weekDates(cur), now = Date.now();
    const totalThrough = d => week.filter(x => x <= d).reduce((t,x) => t + worked(state.entries[x]), 0);
    week.forEach(d => {
      const en = state.entries[d];
      if (!en || d > r.anchor) return;
      if (en.sent || (d === cur && !en.off)){
        en.sent = { line: dayLine(d, en), total: totalLine(totalThrough(d)), at: now };
      }
    });
    persist();
  }

  function smsHref(body){
    const num = (state.settings.phone||"").replace(/[^\d+]/g,"");
    const ios = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
    return `sms:${num}${ios ? "&" : "?"}body=${encodeURIComponent(body)}`;
  }

  function weekTotalThrough(s){
    const f = formEntry();
    return weekDates(s).filter(d => d <= s).reduce((t,d) => {
      if (d === s) return t + (complete(f) ? worked(f) : 0);
      return t + worked(state.entries[d]);
    }, 0);
  }
  // Weekdays (Mon–Fri) before the selected day, this week, with nothing logged
  const missingDays = s => weekDates(s).filter((d,i) => i < 5 && d < s && !state.entries[d]);
  const sentState = (d, en) => !en || !en.sent ? "" : (dayLine(d, en) !== en.sent.line ? "stale" : "ok");

  function render(){
    const off = isOff();
    const e = formEntry(), ok = complete(e);
    const d = parseIso(cur);
    $("dateVal").textContent = (cur === today ? "Today · " : "") + `${DOW[(d.getDay()+6)%7]}, ${MON[d.getMonth()]} ${d.getDate()}`;

    // week header + nav
    const m0 = monday(cur);
    $("weekLabel").textContent = `Week of ${MON[m0.getMonth()]} ${m0.getDate()}`;
    $("nextWk").disabled = addDays(iso(m0), 7) > today;
    $("weekTitle").textContent = weekDates(cur).includes(today) ? "This week" : `Week of ${md(iso(m0))}`;

    $("workBox").hidden = off;
    $("offPanel").hidden = !off;
    $("offBtn").textContent = off ? "Not a day off — log hours" : "Mark as day off";

    if (!off){
      $("startVal").textContent = e.start ? fmtTime(e.start) : "—";
      $("startVal").classList.toggle("blank", !e.start);
      $("endVal").textContent = e.end ? fmtTime(e.end) : "—";
      $("endVal").classList.toggle("blank", !e.end);
      $("startPick").classList.toggle("attn", !e.start);
      $("endPick").classList.toggle("attn", !e.end || endIsDefault);
      brks.forEach((b, i) => {
        const el = b.el;
        el.sVal.textContent = b.s ? fmtTime(b.s) : "—"; el.sVal.classList.toggle("blank", !b.s);
        el.eVal.textContent = b.e ? fmtTime(b.e) : "—"; el.eVal.classList.toggle("blank", !b.e);
        el.sPick.classList.toggle("attn", !b.s || b.sDef);
        el.ePick.classList.toggle("attn", !b.e || b.eDef);
        const name = brks.length > 1 ? `Break ${i+1}` : "Break";
        el.foot.textContent = validBreak(b) ? `${name} · ${fmtDur(between(b.s, b.e))} unpaid` : `${name} · set both times`;
      });
      $("addRow").hidden = brks.length >= MAX_BREAKS;
      $("addLbl").textContent = brks.length ? "Second break" : "Unpaid break";
    }

    $("dayTot").textContent = off ? "0hrs" : (ok ? fmtDur(worked(e)) : "—");
    $("weekTot").textContent = fmtDur(weekTotalThrough(cur));

    // status
    const saved = state.entries[cur], draft = state.drafts[cur];
    let st = "Not logged yet", cls = "";
    if (saved && sameEntry(saved, e)){
      const ss = sentState(cur, saved);
      if (ss === "ok") { st = "✓ Texted"; cls = " ok"; }
      else if (ss === "stale") { st = "Changed since texted"; cls = " warnc"; }
      else { st = off ? "Day off" : "Logged · not texted"; }
    } else if (!saved && draft && cur === today) {
      st = `Started ${fmtTime(draft.start)}`;
    }
    $("status").textContent = st;
    $("status").className = "status" + cls;

    // message
    const r = compose();

    // warnings
    const warns = [];
    const miss = missingDays(cur);
    if (miss.length){
      warns.push(`Nothing logged for ${miss.map(dayName).join(", ")}. Log the hours or mark ${miss.length > 1 ? "them as days" : "it as a day"} off. The week total doesn't include ${miss.length > 1 ? "those days" : "that day"}.`);
    }
    if (!off && ok && !(endIsDefault && !saved)){
      const w = worked(e);
      if (crossesMidnight(e)) warns.push(`End is earlier than start, so this counts as working past midnight (${fmtDur(w)}). Check AM/PM.`);
      else if (w > LONG_DAY) warns.push(`That's ${fmtDur(w)} in one day. Check AM/PM.`);
      warns.push(...breakProblems(e));
    }
    if (!off && brks.some(b => b.sDef || b.eDef)) warns.push("Break times in orange are placeholders. Set them to when you actually took the break.");
    if (!off && endIsDefault && e.end && !saved) warns.push(cur === today
      ? "End time is showing the current time. Tap Now when you finish, or set it on the wheel."
      : "End time was filled in from your last entry. Make sure it's right.");
    if (r && (r.kind === "fix" || r.kind === "daily+fix") && r.fixed.length){
      warns.push(`You changed ${r.fixed.map(dayName).join(", ")} after texting it, so this text includes a correction.`);
    }
    if (r && r.kind === "fix" && !(saved && saved.sent) && !off){
      warns.push("You've already texted a later day this week, so this goes out as a correction with the updated week total.");
    }
    $("warn").innerHTML = warns.map(w => `<div>⚠︎ ${w}</div>`).join("");
    $("warn").classList.toggle("show", warns.length > 0);

    $("msg").textContent = r ? r.text
      : off ? "Day off. Nothing to text."
      : (TIME_RE.test(e.start) && TIME_RE.test(e.end) ? "Set both break times, or remove the break." : "Set a start and end time.");
    $("msg").classList.toggle("blank", !r);
    $("copyBtn").classList.toggle("disabled", !r);
    $("textBtn").classList.toggle("disabled", !r);
    $("textBtn").href = r ? smsHref(r.text) : "#";
    const who = state.settings.name ? ` ${state.settings.name}` : "";
    $("textLbl").textContent = r && r.kind === "fix" ? "Text fix" : `Text${who}`;

    // week list
    const list = $("weekList"); list.innerHTML = "";
    let anySent = false;
    weekDates(cur).forEach((s,i)=>{
      const en = state.entries[s];
      const isMissing = !en && i < 5 && s < today;
      const row = document.createElement("div");
      row.className = "row" + (en ? "" : " empty") + (isMissing ? " missing" : "") + (s === cur ? " sel" : "") + (!en && s > today && s !== cur ? " future" : "");
      let tm = "—", h = "";
      if (en && en.off) { tm = "Day off"; }
      else if (en){
        const nb = Math.max(entryBreaks(en).length, en.brk ? 1 : 0);
        tm = fmtTime(en.start)+"–"+fmtTime(en.end)+(en.brk ? ` · ${fmtDur(en.brk)} break${nb > 1 ? "s" : ""}` : "");
        h = fmtDur(worked(en));
      } else if (isMissing) tm = "Not logged";
      else if (!en && s === today && state.drafts[s]) tm = `Started ${fmtTime(state.drafts[s].start)}`;
      const ss = sentState(s, en); if (ss) anySent = true;
      const badge = ss === "ok" ? `<span class="badge">✓</span>` : ss === "stale" ? `<span class="badge stale">●</span>` : `<span class="badge"></span>`;
      row.innerHTML = `<span class="d">${DOW[i]} ${md(s)}</span><span class="tm">${tm}</span><span class="h">${h}${badge}</span>`;
      row.onclick = () => { haptic(); loadDate(s); };
      list.appendChild(row);
    });
    $("legend").textContent = anySent ? "✓ texted   ● changed since texted" : "";
    $("delBtn").style.display = saved ? "" : "none";
  }

  // ---------- toast ----------
  let tt;
  function toast(t, undoable){
    const el = $("toast"); $("toastTxt").textContent = t;
    el.classList.toggle("undoable", !!undoable);
    el.classList.add("show"); clearTimeout(tt);
    tt = setTimeout(()=>el.classList.remove("show"), undoable ? 5000 : 1800);
  }

  async function copyText(txt, fallbackEl){
    try { await navigator.clipboard.writeText(txt); return true; }
    catch(e){
      if (fallbackEl){
        const r = document.createRange(); r.selectNodeContents(fallbackEl);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      return false;
    }
  }

  // ---------- events ----------
  $("date").addEventListener("change", e => { if (e.target.value) loadDate(e.target.value); });
  ["start","end"].forEach(id => {
    $(id).addEventListener("input", () => { if (id === "end") endIsDefault = false; render(); });
    $(id).addEventListener("change", () => { if (id === "end") endIsDefault = false; saveCurrent(); });
  });
  ["startNow","endNow"].forEach(id => {
    $(id).addEventListener("click", ev => {
      ev.preventDefault(); ev.stopPropagation(); haptic();
      const field = id === "startNow" ? "start" : "end";
      $(field).value = nowExact();
      if (field === "end") endIsDefault = false;
      saveCurrent();
      toast(field === "start" ? `Started ${fmtTime($("start").value)}` : `Finished ${fmtTime($("end").value)}`);
    });
  });

  $("prevWk").addEventListener("click", () => { haptic(); loadDate(addDays(cur, -7)); });
  $("nextWk").addEventListener("click", () => {
    haptic(); const n = addDays(cur, 7); loadDate(n > today ? today : n);
  });

  $("addBrk").addEventListener("click", () => {
    if (brks.length >= MAX_BREAKS) return;
    haptic();
    const i = brks.length;
    // Placeholder: the same break from your most recent day that had one, else 12–12:30 / 3–3:15
    const prev = Object.keys(state.entries).sort().reverse().map(k => entryBreaks(state.entries[k])).find(l => l.length > i);
    const def = prev ? prev[i] : (i === 0 ? { s:"12:00", e:"12:30" } : { s:"15:00", e:"15:15" });
    brks.push({ s:def.s, e:def.e, sDef:true, eDef:true });
    buildBreaks();
    render();
  });

  // Sending: save, then remember what was sent (after the link has opened Messages)
  function prepareSend(){
    const r = compose(); if (!r) return null;
    endIsDefault = false;
    brks.forEach(b => { b.sDef = b.eDef = false; });
    saveCurrent();
    return compose() || r;
  }
  $("copyBtn").addEventListener("click", async () => {
    const r = prepareSend(); if (!r) return;
    haptic();
    const ok = await copyText(r.text, $("msg"));
    if (ok) { markSent(r); render(); toast("Copied — paste into your text"); }
    else toast("Selected — tap Copy");
  });
  $("textBtn").addEventListener("click", ev => {
    if (!compose()){ ev.preventDefault(); return; }
    haptic();
    if (!state.settings.phone){ ev.preventDefault(); openSettings(); toast("Add your client's number first"); return; }
    const r = prepareSend();
    $("textBtn").href = smsHref(r.text);
    setTimeout(() => { markSent(r); render(); }, 400);
  });

  let offArm;
  $("offBtn").addEventListener("click", () => {
    const b = $("offBtn"), saved = state.entries[cur];
    haptic();
    if (isOff()){
      snapshot(cur);
      delete state.entries[cur]; persist(); loadDate(cur); offerUndo(`${dayName(cur)} is no longer a day off`);
      return;
    }
    if (saved && !b.classList.contains("armed")){
      b.classList.add("armed"); b.textContent = "Tap again to replace these hours with a day off";
      offArm = setTimeout(()=>{ b.classList.remove("armed"); render(); }, 3000);
      return;
    }
    clearTimeout(offArm); b.classList.remove("armed");
    snapshot(cur);
    state.entries[cur] = Object.assign({ off:true }, saved && saved.sent ? { sent:saved.sent } : {});
    delete state.drafts[cur];
    persist(); loadDate(cur); offerUndo(`${dayName(cur)} marked as a day off`);
  });

  let armT;
  $("delBtn").addEventListener("click", () => {
    const b = $("delBtn");
    if (!b.classList.contains("armed")){
      b.classList.add("armed"); b.textContent = "Tap again to delete";
      armT = setTimeout(()=>{ b.classList.remove("armed"); b.textContent = "Delete this day's entry"; }, 3000);
      return;
    }
    clearTimeout(armT); b.classList.remove("armed"); b.textContent = "Delete this day's entry";
    snapshot(cur);
    delete state.entries[cur]; delete state.drafts[cur]; persist(); haptic(); loadDate(cur); offerUndo(`Deleted ${dayName(cur)}`);
  });

  function weekText(){
    const week = weekDates(cur).filter(d => state.entries[d]);
    if (!week.length) return null;
    const total = week.reduce((t,d) => t + worked(state.entries[d]), 0);
    return [`Week of ${md(iso(monday(cur)))}`, ...week.map(d => dayLine(d, state.entries[d])), totalLine(total)].join("\n");
  }
  $("copyWeek").addEventListener("click", async () => {
    haptic();
    const t = weekText();
    if (!t){ toast("Nothing logged this week yet"); return; }
    toast(await copyText(t) ? "Week copied" : "Couldn't copy on this device");
  });

  // ---------- settings + backup ----------
  function backupNote(){
    const keys = Object.keys(state.entries).sort();
    $("backupNote").textContent = keys.length
      ? `${keys.length} day${keys.length>1?"s":""} saved on this phone (${md(keys[0])} – ${md(keys[keys.length-1])}). Copy a backup into Notes now and then; restore it here if you ever reinstall or switch phones.`
      : "Nothing logged yet. Once you have hours saved, copy a backup into Notes now and then.";
  }
  function openSettings(){
    $("cName").value = state.settings.name; $("cPhone").value = state.settings.phone; $("showBrk").checked = !!state.settings.showBrk;
    $("restoreText").value = ""; backupNote();
    $("version").textContent = `Version ${VERSION} · Updated ${UPDATED}`;
    $("sheet").classList.add("open");
  }
  function closeSettings(){
    state.settings.name = $("cName").value.trim();
    state.settings.phone = $("cPhone").value.trim();
    state.settings.showBrk = $("showBrk").checked;
    persist(); $("sheet").classList.remove("open"); render();
  }
  function backupText(){
    return `Hours backup ${md(today)}/${today.slice(0,4)}\n` + JSON.stringify({ v:3, entries: state.entries });
  }
  function parseBackup(txt){
    const i = txt.indexOf("{"), j = txt.lastIndexOf("}");
    if (i < 0 || j < i) return null;
    let obj; try { obj = JSON.parse(txt.slice(i, j+1)); } catch(e){ return null; }
    const src = obj && obj.entries; if (!src || typeof src !== "object") return null;
    const clean = {};
    for (const [k,v] of Object.entries(src)){
      if (!DATE_RE.test(k) || !v) continue;
      const sent = v.sent && typeof v.sent.line === "string" && typeof v.sent.total === "string"
        ? { line:v.sent.line.slice(0,300), total:v.sent.total.slice(0,100), at:+v.sent.at || 0 } : null;
      let en = null;
      if (v.off) en = { off:true };
      else if (TIME_RE.test(v.start) && TIME_RE.test(v.end)){
        const bs = entryBreaks(v).slice(0, MAX_BREAKS);
        en = bs.length
          ? { start:v.start, end:v.end, brk: bs.reduce((t,b) => t + between(b.s, b.e), 0), breaks: bs }
          : { start:v.start, end:v.end, brk: Math.max(0, Math.min(600, +v.brk || 0)) };
      }
      if (!en) continue;
      if (sent) en.sent = sent;
      clean[k] = en;
    }
    return clean;
  }

  $("backupBtn").addEventListener("click", async () => {
    haptic();
    if (!Object.keys(state.entries).length){ toast("Nothing to back up yet"); return; }
    const txt = backupText();
    if (await copyText(txt)) toast("Backup copied — paste it into Notes");
    else { $("restoreText").value = txt; $("restoreText").select(); toast("Selected — tap Copy"); }
  });
  $("restoreBtn").addEventListener("click", () => {
    haptic();
    const raw = $("restoreText").value.trim();
    if (!raw){ toast("Paste a backup into the box first"); $("restoreText").focus(); return; }
    const entries = parseBackup(raw);
    const n = entries ? Object.keys(entries).length : 0;
    if (!n){ toast("That doesn't look like a backup"); return; }
    Object.assign(state.entries, entries);
    if (persist()){ toast(`Restored ${n} day${n>1?"s":""}`); $("restoreText").value = ""; backupNote(); loadDate(cur); }
  });

  $("openSettings").addEventListener("click", () => { haptic(); openSettings(); });
  $("closeSettings").addEventListener("click", () => { haptic(); closeSettings(); });
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSettings(); });

  // Reopened later: jump to the new day; keep the default end time current
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    const t = iso(new Date());
    if (t !== today) { today = t; loadDate(t); return; }
    if (cur === today && endIsDefault && !state.entries[cur]) { $("end").value = nowExact(); render(); }
  });

  // exposed for testing
  window.__hours = { fmtTime, fmtDur, worked, weekDates, compose, state, loadDate, parseBackup, backupText, weekText,
                     get cur(){ return cur; } };

  loadDate(today);
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
