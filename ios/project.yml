# XcodeGen spec for the native Hours app.  Generate:  cd ios && xcodegen
# Your Apple team ID goes in ios/Local.xcconfig (gitignored):  DEVELOPMENT_TEAM = XXXXXXXXXX
name: Hours
options:
  bundleIdPrefix: tv.firman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Hours:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
        excludes: ["*.js"]
      - path: Shared/bridge.js
        buildPhase: resources
      - path: ../core.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.firman.hours
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Hours
        CODE_SIGN_ENTITLEMENTS: App/Hours.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hours
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: tv.firman.hours
            CFBundleURLSchemes: [hours]
    dependencies:
      - target: HoursWidget
        embed: true

  HoursWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
        excludes: ["*.js"]
      - path: Shared/bridge.js
        buildPhase: resources
      - path: ../core.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.firman.hours.widget
        CODE_SIGN_ENTITLEMENTS: Widget/HoursWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Hours
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hours
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  HoursTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Hours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.firman.hours.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hours.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hours
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Hours:
    build:
      targets:
        Hours: all
        HoursTests: [test]
    test:
      targets: [HoursTests]
    run:
      config: Debug
